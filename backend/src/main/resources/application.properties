# ============================================================
#  Event Bridge Backend - Application Configuration
#  Uses environment variables for secrets (safe for production)
#  Fallback defaults are for local development only
# ============================================================

# ----- Server Configuration -----
server.port=${PORT:8080}

# ----- MySQL Database Connection -----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/event_bridge_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate Settings -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ----- Gmail SMTP Configuration -----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:kharihari2006@gmail.com}
spring.mail.password=${MAIL_PASSWORD:hybmqtgtokehyojb}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ----- JWT Security Configuration -----
app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwtExpirationMs=86400000

# ----- Application Email Properties -----
app.email.from=${MAIL_USERNAME:kharihari2006@gmail.com}

# ----- Logging -----
logging.level.com.eventbridge=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.mail=DEBUG
